# contracts.yml
#
# Source of truth for the contracts the ETL must execute (SJRA-1546, section 3.1).
# One entry per source under `sources.<name>.contracts`. Fields:
#   lineage       - "{MAJOR}.{MINOR}" the contract corresponds to (dot separated).
#   table         - Iceberg table name linked to that lineage's MAJOR.
#   normalizer    - FQCN of the normalizer holding the schema for that lineage's MAJOR.
#   release_notes - Path to the release notes for that lineage's MAJOR.
#
# A new MINOR bumps `lineage` on the existing row; a new MAJOR adds a new row.
sources:
  clinvar:
    contracts:
      - lineage: "1.0"
        table: "clinvar"
        normalizer: "org.radiant.opendatalake.normalized.Clinvar"
        release_notes: "doc/release-notes/clinvar/v1.md"
  dbsnp:
    contracts:
      - lineage: "1.0"
        table: "dbsnp"
        normalizer: "org.radiant.opendatalake.normalized.DBSNP"
        release_notes: "doc/release-notes/dbsnp/v1.md"
