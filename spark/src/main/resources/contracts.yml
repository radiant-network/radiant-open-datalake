# contracts.yml
#
# Source of truth for the contracts the ETL must execute (SJRA-1546, section 3.1).
# One entry per source under `sources.<name>`:
#   table_prefix  - Prefix to which the `v{MAJOR}` suffix is appended to name the Iceberg table.
#   contracts     - One entry per MAJOR:
#       lineage       - "{MAJOR}.{MINOR}" the contract corresponds to (dot separated).
#       release_notes - Path to the release notes for that lineage's MAJOR, relative to `spark/`.
#
# A new MINOR bumps `lineage` on the existing row. A new MAJOR adds a new row with its own `lineage` and `release_notes`.
sources:
  "1000_genomes":
    table_prefix: "1000_genomes"
    contracts:
      - lineage: "1.0"
        release_notes: "doc/release-notes/1000_genomes/v1.md"
