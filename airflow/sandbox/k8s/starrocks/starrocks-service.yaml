apiVersion: v1
kind: Service
metadata:
  labels:
    app: opendatalake-starrocks
  name: opendatalake-starrocks
spec:
  # LoadBalancer so it is reachable at localhost via `minikube tunnel` (like MinIO / the Airflow UI).
  type: LoadBalancer
  ports:
    - name: "9030"
      port: 9030
      targetPort: 9030
    - name: "8030"
      port: 8030
      targetPort: 8030
  selector:
    app: opendatalake-starrocks
