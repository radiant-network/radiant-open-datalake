apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: polaris
  name: polaris
spec:
  replicas: 1
  selector:
    matchLabels:
      app: polaris
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: polaris
    spec:
      containers:
        - name: polaris
          image: apache/polaris:1.1.0-incubating
          ports:
            - containerPort: 8181  # catalog REST API + management API
              protocol: TCP
            - containerPort: 8182  # Quarkus health / metrics
              protocol: TCP
          env:
            # Static MinIO root credentials Polaris vends to clients (no AWS STS available).
            - name: AWS_REGION
              value: us-east-1
            - name: AWS_ACCESS_KEY_ID
              value: admin
            - name: AWS_SECRET_ACCESS_KEY
              value: password
            # Auto-bootstraps realm POLARIS and root principal (clientId=root, secret=s3cr3t).
            - name: POLARIS_BOOTSTRAP_CREDENTIALS
              value: POLARIS,root,s3cr3t
            - name: POLARIS_REALM_CONTEXT_REALMS
              value: POLARIS
            # In-memory metastore: development only, catalog metadata is lost on pod restart.
            - name: POLARIS_PERSISTENCE_TYPE
              value: in-memory
            - name: QUARKUS_OTEL_SDK_DISABLED
              value: "true"
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8182
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8182
            initialDelaySeconds: 30
            periodSeconds: 10
      restartPolicy: Always
